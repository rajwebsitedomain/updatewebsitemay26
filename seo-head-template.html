<!--
  ============================================================
  seo-head-template.html
  ============================================================
  Copy the content inside <head>...</head> into every page
  of your website. Replace all placeholder values with your
  real content. This covers:
    • Core SEO meta tags
    • Open Graph (Facebook, LinkedIn, WhatsApp)
    • Twitter / X Cards
    • Structured Data (JSON-LD Schema.org)
    • PWA / manifest
    • Favicon set
    • RSS/Atom feed autodiscovery
    • Canonical URL
    • Robots directives
  ============================================================
-->
<!DOCTYPE html>

  <!-- ======================================================
       CORE SEO META TAGS
  ====================================================== -->
  <title>Rajvardhan Singh · Digital & Cloud Alchemist -SiteMap</title>
  <meta name="description" content="A compelling description of this page in 150–160 characters. Include your main keyword naturally. This appears in Google search results.">
  <meta name="keywords" content="keyword one, keyword two, keyword three"><!-- optional, low SEO weight but harmless -->
  <meta name="author" content="Your Name">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
  <meta name="googlebot" content="index, follow">
